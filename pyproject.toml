[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-doc-agent"
version = "0.1.0"
description = "Deterministic, provenance-first documentation for Power BI PBIP/TMDL/PBIR projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Marcus Vinicius"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
powerbi-doc = "powerbi_doc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
